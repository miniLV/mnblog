<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__TITLE__</title>
  <style>
    :root {
      --paper: #f7f3eb;
      --ink: #1f1e1d;
      --muted: #6b6560;
      --grid: rgba(31, 30, 29, 0.05);
      --clay: #d97757;
      --clay-soft: #f3ddd2;
      --fig: #c45c7a;
      --fig-soft: #f5dce5;
      --olive: #6b7f5a;
      --olive-soft: #e2ead8;
      --sky: #5b7c99;
      --sky-soft: #d9e6f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        var(--paper);
      background-size: 28px 28px;
      color: var(--ink);
      font-family: "Chalkboard SE", "Comic Sans MS", "Marker Felt", "PingFang SC", "Source Sans 3", sans-serif;
    }
    .page {
      width: 1200px;
      height: 675px;
      margin: 0 auto;
      padding: 48px 56px;
      position: relative;
      overflow: hidden;
    }
    .kicker {
      color: var(--clay);
      font-family: "Avenir Next", "PingFang SC", sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 18px 0 0;
      max-width: 820px;
      font-size: 64px;
      line-height: 1.05;
      letter-spacing: -0.02em;
      font-weight: 700;
    }
    .subtitle {
      margin: 22px 0 0;
      max-width: 720px;
      color: var(--muted);
      font-family: "Avenir Next", "PingFang SC", sans-serif;
      font-size: 22px;
      line-height: 1.45;
      font-weight: 600;
    }
    .stamp {
      position: absolute;
      top: 52px;
      right: 56px;
      width: 118px;
      height: 118px;
      border: 3px solid var(--clay);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--clay);
      font-family: "Avenir Next", sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transform: rotate(12deg);
      background: rgba(247, 243, 235, 0.85);
    }
    .card {
      position: absolute;
      border: 2.5px solid var(--ink);
      border-radius: 18px;
      padding: 18px 20px;
      background: var(--panel, #fffdf7);
      box-shadow: 4px 5px 0 rgba(31, 30, 29, 0.08);
      transform: rotate(-1.5deg);
    }
    .card.a {
      left: 56px;
      bottom: 56px;
      width: 280px;
      background: var(--clay-soft);
      transform: rotate(-2deg);
    }
    .card.b {
      left: 370px;
      bottom: 72px;
      width: 300px;
      background: var(--olive-soft);
      transform: rotate(1.2deg);
    }
    .card.c {
      right: 56px;
      bottom: 58px;
      width: 290px;
      background: var(--sky-soft);
      transform: rotate(-0.8deg);
    }
    .card strong {
      display: block;
      font-size: 20px;
      margin-bottom: 6px;
    }
    .card span {
      color: var(--muted);
      font-family: "Avenir Next", "PingFang SC", sans-serif;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
    }
    .scribble {
      position: absolute;
      right: 210px;
      top: 210px;
      width: 160px;
      height: 90px;
      border: 2.5px dashed var(--fig);
      border-radius: 40% 60% 55% 45%;
      opacity: 0.55;
      transform: rotate(-8deg);
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="kicker">__KICKER__</div>
    <h1>__TITLE__</h1>
    <p class="subtitle">__SUBTITLE__</p>
    <div class="stamp">mnblog<br>cover</div>
    <div class="scribble" aria-hidden="true"></div>
    <div class="card a"><strong>Write</strong><span>Markdown in _posts/</span></div>
    <div class="card b"><strong>Draw</strong><span>Sketchboard HTML → PNG</span></div>
    <div class="card c"><strong>Publish</strong><span>mnblog publish · Pages</span></div>
  </div>
</body>
</html>
