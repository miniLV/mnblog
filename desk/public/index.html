<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mnblog Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/desk.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true">m</span>
      <div>
        <strong id="site-title">mnblog Desk</strong>
        <p class="muted" id="site-path">—</p>
      </div>
    </div>
    <div class="top-actions">
      <label class="field">
        <span class="sr">Agent</span>
        <select id="agent-pick" title="Agent">
          <option value="auto">auto</option>
          <option value="claude">claude</option>
          <option value="codex">codex</option>
        </select>
      </label>
      <button type="button" id="btn-preview" class="ghost" title="Open markdown preview pane">Preview</button>
      <button type="button" id="btn-theme" class="ghost" title="Toggle theme">Theme</button>
      <button type="button" id="btn-save" class="ghost" disabled>Save</button>
      <button type="button" id="btn-publish" class="primary">Publish</button>
    </div>
  </header>

  <main class="desk">
    <aside class="pane list-pane">
      <div class="pane-head">
        <strong>Posts</strong>
        <button type="button" id="btn-refresh" class="icon-btn" title="Refresh">↻</button>
      </div>
      <div class="filters">
        <button type="button" class="chip active" data-filter="all">All</button>
        <button type="button" class="chip" data-filter="post">Posts</button>
        <button type="button" class="chip" data-filter="draft">Drafts</button>
      </div>
      <ul id="post-list" class="post-list"></ul>
      <p class="hint muted" id="list-hint">Loading…</p>
    </aside>

    <section class="pane editor-pane">
      <div class="pane-head">
        <span id="current-path" class="mono muted">No file selected</span>
        <span id="dirty-dot" class="dirty hidden" title="Unsaved">●</span>
      </div>
      <textarea id="editor" spellcheck="false" placeholder="Select a post from the left, or create one with: mnblog new &quot;Title&quot;"></textarea>
      <div id="preview" class="preview hidden" aria-hidden="true"></div>
    </section>

    <aside class="pane chat-pane">
      <div class="pane-head">
        <strong>Agent</strong>
        <span class="badge" id="agent-badge">one-shot</span>
      </div>
      <p class="limit-note muted" id="limit-note">
        Each send runs a fresh local <code>claude -p</code> / <code>codex exec</code>. No cloud keys in mnblog.
      </p>
      <div id="chat-log" class="chat-log"></div>
      <form id="chat-form" class="chat-form">
        <textarea id="chat-input" rows="3" placeholder="Ask about the open post… e.g. tighten the intro, add tags, draft a summary"></textarea>
        <div class="chat-actions">
          <button type="submit" id="btn-send" class="primary">Send</button>
          <button type="button" id="btn-stop" class="ghost" disabled>Stop</button>
        </div>
      </form>
    </aside>
  </main>

  <div id="toast" class="toast hidden" role="status"></div>
  <dialog id="publish-dialog">
    <form method="dialog" id="publish-form">
      <h2>Publish</h2>
      <p class="muted">Runs <code>mnblog publish</code> in the site root (git add / commit / push). Confirm only when you mean it.</p>
      <label>
        Commit message
        <input type="text" id="publish-message" value="content: update from desk" />
      </label>
      <label class="check">
        <input type="checkbox" id="publish-dry" />
        Dry run only
      </label>
      <div class="dialog-actions">
        <button type="submit" value="cancel" class="ghost">Cancel</button>
        <button type="submit" value="ok" class="primary" id="publish-confirm">Confirm publish</button>
      </div>
      <pre id="publish-out" class="publish-out hidden"></pre>
    </form>
  </dialog>

  <script src="/static/desk.js"></script>
</body>
</html>
