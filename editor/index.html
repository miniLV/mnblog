<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mnblog editor → Desk</title>
  <style>
    :root { --bg:#faf9f5; --fg:#141413; --muted:#87867f; --accent:#d97757; --border:rgba(20,20,19,.12); --font:"Source Sans 3",Helvetica,Arial,sans-serif; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:var(--font); background:var(--bg); color:var(--fg); padding:2rem; }
    main { max-width:32rem; border:1px solid var(--border); border-radius:.75rem; padding:1.5rem; background:#f0eee6; }
    h1 { font-size:1.25rem; margin:0 0 .5rem; }
    p { color:var(--muted); line-height:1.5; }
    code { font-family:ui-monospace,monospace; font-size:.9em; color:var(--fg); }
    a.btn { display:inline-block; margin-top:.75rem; padding:.45rem .9rem; background:var(--accent); color:#fff; text-decoration:none; border-radius:.5rem; font-weight:600; }
  </style>
</head>
<body>
  <main>
    <h1>Editor stub retired</h1>
    <p>v0.3 replaces this page with the local <strong>Desk</strong> UI (posts + Markdown + one-shot agent chat).</p>
    <p>From your blog site root:</p>
    <p><code>mnblog desk --ui</code><br>or <code>mnblog ui</code></p>
    <p>Then open <code>http://127.0.0.1:4177/</code>. Agents still prefer the CLI.</p>
  </main>
</body>
</html>
