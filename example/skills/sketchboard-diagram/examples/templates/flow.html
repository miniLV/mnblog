<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__TITLE__</title>
  <style>
    :root {
      --paper: #f8f5ec;
      --ink: #1f2328;
      --muted: #716b61;
      --grid: rgba(31, 35, 40, 0.055);
      --orange: #d76838;
      --orange-soft: #ffe0c6;
      --green: #3f8f52;
      --green-soft: #d8f0cf;
      --blue: #3867d6;
      --blue-soft: #dbe7ff;
      --teal: #20898d;
      --teal-soft: #d2f0ef;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        var(--paper);
      background-size: 34px 34px;
      color: var(--ink);
      font-family: "Chalkboard SE", "Comic Sans MS", "Marker Felt", "PingFang SC", sans-serif;
    }
    .page {
      width: 1500px;
      height: 900px;
      margin: 0 auto;
      padding: 42px 52px;
      position: relative;
      overflow: hidden;
    }
    .kicker {
      color: var(--orange);
      font-family: "Avenir Next", "PingFang SC", sans-serif;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    h1 { margin: 8px 0 0; font-size: 48px; line-height: 1.05; }
    .subtitle {
      margin: 14px 0 0;
      width: 980px;
      color: var(--muted);
      font-family: "Avenir Next", "PingFang SC", sans-serif;
      font-size: 20px;
      line-height: 1.5;
      font-weight: 650;
    }
    .board { position: absolute; inset: 160px 52px 52px; }
    .card {
      position: absolute;
      width: 320px;
      min-height: 160px;
      border: 2.5px solid var(--ink);
      border-radius: 18px;
      padding: 22px 24px;
      background: #fffdf7;
      box-shadow: 5px 6px 0 rgba(31, 35, 40, 0.08);
    }
    .card.s1 { left: 40px; top: 180px; background: var(--orange-soft); transform: rotate(-1.2deg); }
    .card.s2 { left: 520px; top: 160px; background: var(--blue-soft); transform: rotate(1deg); }
    .card.s3 { left: 1000px; top: 190px; background: var(--green-soft); transform: rotate(-0.6deg); }
    .card strong { display: block; font-size: 28px; margin-bottom: 10px; }
    .card span {
      color: var(--muted);
      font-family: "Avenir Next", "PingFang SC", sans-serif;
      font-size: 18px;
      font-weight: 650;
      line-height: 1.4;
    }
    svg.connectors {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .card { z-index: 1; }
  </style>
</head>
<body>
  <div class="page">
    <div class="kicker">flow</div>
    <h1>__TITLE__</h1>
    <p class="subtitle">__SUBTITLE__</p>
    <div class="board">
      <svg class="connectors" viewBox="0 0 1396 688" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M0,0 L10,5 L0,10 Z" fill="#1f2328"></path>
          </marker>
        </defs>
        <path d="M360 260 H500" stroke="#1f2328" stroke-width="2.6" marker-end="url(#arrow)"></path>
        <path d="M840 250 H980" stroke="#1f2328" stroke-width="2.6" marker-end="url(#arrow)"></path>
      </svg>
      <div class="card s1"><strong>Step 1</strong><span>__STEP1__</span></div>
      <div class="card s2"><strong>Step 2</strong><span>__STEP2__</span></div>
      <div class="card s3"><strong>Step 3</strong><span>__STEP3__</span></div>
    </div>
  </div>
</body>
</html>
